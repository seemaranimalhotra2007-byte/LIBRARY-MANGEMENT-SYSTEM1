spring.application.name=library-management-system
server.port=8080
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.boot.web.embedded.tomcat.TomcatWebServer=INFO

# ---- Database (embedded H2, stored in ./data/librarydb.mv.db) ----
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---- MySQL alternative (also uncomment the dependency in pom.xml) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---- Library business rules ----
library.loan-days=14
library.fine-per-day=2.0

# true = also start the old console menu in the Run window (the web front end works either way)
library.console.enabled=false
